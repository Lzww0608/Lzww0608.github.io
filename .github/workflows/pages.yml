name: Deploy Chinese history website

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'content/**'
      - 'scripts/archive-sources.py'
      - 'scripts/index-reading-headings.py'
      - 'scripts/index-person-passages.mjs'
      - 'scripts/index-sentence-alignments.mjs'
      - 'scripts/check-sentence-coverage.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build website
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
